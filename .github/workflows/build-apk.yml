name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Dummy APK Artifact
        run: |
          mkdir -p output
          echo "Master Hub PWA Build Success" > output/Master-Hub-Ubay.txt
          tar -cvf Master-Hub-Ubay-APK.tar index.html manifest.json sw.js

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Master-Hub-Ubay-APK
          path: Master-Hub-Ubay-APK.tar
